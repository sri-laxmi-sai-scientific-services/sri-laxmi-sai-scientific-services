<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Sri Laxmi Sai Scientific Services</title>
<link rel="stylesheet" href="styles.css">
<style>
body{background:#f5f8fb}.login-shell{min-height:100vh;display:grid;place-items:center;padding:28px 16px;box-sizing:border-box}.login-card{width:min(100%,660px);padding:36px;background:#fff;border:1px solid #dce7ee;border-radius:20px;box-shadow:0 18px 55px rgba(8,42,77,.09)}.login-card h1{font-size:clamp(28px,4vw,42px);line-height:1.2;color:var(--navy);margin:14px 0}.login-card p{color:#62768b;line-height:1.7}.login-card label{display:block;font-weight:700;color:var(--navy);margin:18px 0}.login-card input{width:100%;box-sizing:border-box;margin-top:8px;padding:14px;border:1px solid #ccd9e5;border-radius:9px;font:inherit;background:#fff}.login-card input:focus{outline:2px solid #92cdeb;border-color:#0b72b5}.login-card button{width:100%;margin-top:8px}.login-status{min-height:24px;color:#b42318;font-size:14px}.login-brand{display:flex;align-items:center;gap:14px}.login-brand img{width:64px;height:64px;object-fit:contain}.login-brand strong{display:block;color:var(--navy)}.login-brand small{color:#62768b;letter-spacing:.06em}
@media(max-width:560px){.login-card{padding:24px}}
</style></head>
<body>
<main class="login-shell"><section class="login-card" aria-labelledby="page-title">
<div class="login-brand"><img src="logo.png" alt="SLS logo"><div><strong>SRI LAXMI SAI</strong><small>SCIENTIFIC SERVICES</small></div></div>
<span class="badge" style="margin-top:24px">Restricted Area</span>
<h1 id="page-title">Admin Login</h1>
<p>Sign in using the authorized administrator account to view customer enquiries and service requests.</p>
<form id="loginForm">
<label for="adminEmail">Admin email<input id="adminEmail" name="email" type="email" autocomplete="username" required value="saiscientific.dhaara@gmail.com"></label>
<label for="adminPassword">Password<input id="adminPassword" name="password" type="password" autocomplete="current-password" required></label>
<button class="btn primary" type="submit" id="loginButton">Login to Admin</button>
<p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
</form>
<p><a href="index.html">← Return to company website</a></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin-login.js"></script>
</body></html>
